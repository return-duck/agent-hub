# ============================================================================
# Agent Stack：在 80 端口下以独立子路径 /studio/ 提供访问
#
# 部署到 /etc/nginx/default.d/agent-stack-studio.conf
#
# 为什么走这条路：部分网络（公司/学校/手机流量）会屏蔽 8080 这类非标准端口，
# 但 80 一定是通的（你的简历站就在 80 上）。所以把 Agent Stack 也挂一份到 80，
# 提供 http://<ip>/studio/ 这个备用入口。
#
# 为什么可以这么安全地加进来：你 80 端口的 server 块里本来就有
#     include /etc/nginx/default.d/*.conf;
# 所以本文件是【被包含进那个 server 块内部】的 location 列表，
# 完全不需要改动 /etc/nginx/nginx.conf 一个字。
#
# 命名刻意用 /studio/ 与 /studio/api/ 这两个独立前缀，
# 绝不占用简历站已在使用的 /api/（js/p_login.js 等依赖它）。
# ============================================================================

# 不带斜杠时补上，否则页面里的相对资源会解析到根路径去
location = /studio {
    return 301 /studio/;
}

# 公开对话页的短链：/a/<slug>
# 80 端口也要支持，否则分享出去的短链在屏蔽了 8080 的网络里打不开。
# 静态文件从同一个 web 目录取，SPA 回退到 index.html 后由前端按路径解析 slug。
location /a/ {
    # 80 端口上的短链 /a/<slug> 重定向到 /studio/a/<slug>。
    #
    # 为什么不在这里直接把页面发出去：页面里的 API 基址是按挂载前缀推导的，
    # /a/<slug> 推出来是 /api —— 而根路径 /api 是【简历站后端】的命名空间，
    # 不能占用（它的 js/p_login.js 等依赖它）。重定向到 /studio/ 挂载点后，
    # 推导出来的基址是 /studio/api，一切自洽。
    return 302 /studio$request_uri;
}

# 前端资源：构建用的是绝对基址，所以页面会从根路径 /assets/ 取文件
# （公开对话页 /studio/a/<slug> 也一样）。这个路径已确认没被简历站占用。
location ^~ /assets/ {
    root __APP_DIR__/web;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 前端静态资源：$uri 形如 /studio/assets/xxx.js
# root 指向 __APP_DIR__，配合 __APP_DIR__/studio -> web 的相对软链解析到实际文件
#
# 为什么必须带 ^~（这里踩过一次真实的坑）：
#   nginx 的匹配规则是「正则 location 优先于普通前缀 location」。下面 try_files 的
#   SPA 回退会触发一次【内部重定向】到 /studio/index.html，重定向后会重新做一遍
#   location 匹配 —— 此时任何 `location ~* \.html$` 之类的正则都会把它截走，
#   而那种块通常不写 root，于是继承 80 端口 server 块顶层的简历站 root，
#   最终去 /home/admin/resume-web/studio/index.html 找文件 → 404。
#   加上 ^~ 后，命中 /studio/ 前缀就不再检查正则，回退目标不会再被别的配置劫持。
location ^~ /studio/ {
    root __APP_DIR__;
    index index.html;
    try_files $uri $uri/ /studio/index.html;
}

# API：/studio/api/xxx -> 转发到 Java 后端的 /api/xxx（去掉 /studio 前缀）
# 同样带 ^~：避免将来别处新增的正则 location 影响到接口前缀
location ^~ /studio/api/ {
    proxy_pass         http://127.0.0.1:__SERVER_PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;   # 必须用 $http_host：$host 不含端口，
                                                       # 会让后端把自己的地址算成 127.0.0.1:18080，
                                                       # 从而把同源请求误判成跨域 → 403 Invalid CORS request
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE 必须关缓冲，否则流式事件会被攒着一次性发出
    proxy_buffering    off;
    proxy_cache        off;
    proxy_set_header   Connection '';
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 15s;
}
