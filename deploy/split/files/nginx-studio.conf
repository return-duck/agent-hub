# ============================================================================
# Agent Stack：在 80 端口下以独立子路径 /studio/ 提供访问
#
# 部署到 /etc/nginx/default.d/agent-stack-studio.conf
#
# 为什么走这条路：部分网络（公司/学校/手机流量）会屏蔽 8080 这类非标准端口，
# 但 80 一定是通的（你的简历站就在 80 上）。所以把 Agent Stack 也挂一份到 80，
# 提供 http://<ip>/studio/ 这个备用入口。
#
# 为什么可以这么安全地加进来：你 80 端口的 server 块里本来就有
#     include /etc/nginx/default.d/*.conf;
# 所以本文件是【被包含进那个 server 块内部】的 location 列表，
# 完全不需要改动 /etc/nginx/nginx.conf 一个字。
#
# 命名刻意用 /studio/ 与 /studio/api/ 这两个独立前缀，
# 绝不占用简历站已在使用的 /api/（js/p_login.js 等依赖它）。
# ============================================================================

# 不带斜杠时补上，否则页面里的相对资源会解析到根路径去
location = /studio {
    return 301 /studio/;
}

# 前端静态资源：$uri 形如 /studio/assets/xxx.js
# root 指向 __APP_DIR__，配合 __APP_DIR__/studio -> web 的相对软链解析到实际文件
location /studio/ {
    root __APP_DIR__;
    index index.html;
    try_files $uri $uri/ /studio/index.html;
}

# API：/studio/api/xxx -> 转发到 Java 后端的 /api/xxx（去掉 /studio 前缀）
location /studio/api/ {
    proxy_pass         http://127.0.0.1:__SERVER_PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE 必须关缓冲，否则流式事件会被攒着一次性发出
    proxy_buffering    off;
    proxy_cache        off;
    proxy_set_header   Connection '';
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 15s;
}
