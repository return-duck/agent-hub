# ============================================================================
# Agent Stack：前端 / Java / Node 三包分离部署的 nginx 配置
#
# 部署到 /etc/nginx/conf.d/agent-stack.conf
# （你的 /etc/nginx/nginx.conf 第 35 行已经 include /etc/nginx/conf.d/*.conf，
#   所以放进去就行，不需要改动你现有的 nginx.conf 和 80 端口的 resume 站点）
#
# 拓扑：
#   浏览器 :8080 ──► nginx ──┬── /             → /home/admin/agent-stack/web  （前端静态）
#                            └── /api/         → 127.0.0.1:18080            （Java 后端）
#   Java 后端 ──► 127.0.0.1:18090 （Node runtime，仅内网）
#
# 为什么 nginx 监听 8080：8080 已经被你的安全组放行（公网 TCP 可达已实测），
# 而 8081 在应用未启动时无法验证——用 8080 就不需要你去改安全组。
# ============================================================================
server {
    listen       __APP_PORT__;
    listen       [::]:__APP_PORT__;
    server_name  _;

    root  __APP_DIR__/web;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/agent-stack.access.log;
    error_log  /var/log/nginx/agent-stack.error.log;

    client_max_body_size 8m;

    # ---- API 反向代理到 Java 后端 ----
    location /api/ {
        proxy_pass         http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;   # 必须用 $http_host：$host 不含端口，
                                                       # 会让后端把自己的地址算成 127.0.0.1:18080，
                                                       # 从而把同源请求误判成跨域 → 403 Invalid CORS request
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则事件会被 nginx 攒着一次性发出（前端就看不到逐字流式）
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;

        # 一次 run 可能跑几分钟（工具循环 + 模型），读超时要够大
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 15s;
    }

    # ---- 前端静态资源（带 hash，可长缓存） ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
