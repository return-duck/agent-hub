# Agent Stack 全栈编排（四个独立部署单元的本地组合）
#
# ⚠️ 本文件与三个 Dockerfile 均未经实际构建验证：开发环境没有 Docker。
#    已验证的是非容器形态：scripts/dev.sh + scripts/e2e.sh（38 项断言全通过）。
#    首次在服务器上使用时请预留调试时间（尤其是 web 的 SSE 反代与 server 的 CORS 白名单）。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agent_stack
      MYSQL_USER: agentstack
      MYSQL_PASSWORD: agentstack
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pagentstack"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"

  runtime:
    build: ./runtime
    environment:
      # 填上这三行即可切换为真实模型（不需要改任何代码）
      MODEL_PROVIDER: ${MODEL_PROVIDER:-scripted}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-scripted-deterministic-v1}
      TOOL_HTTP_ALLOWLIST: ${TOOL_HTTP_ALLOWLIST:-example.com,httpbin.org}
    ports:
      - "8090:8090"

  server:
    build: ./server
    environment:
      AGENT_STACK_DB_HOST: mysql
      AGENT_STACK_DB_PORT: "3306"
      AGENT_STACK_DB_NAME: agent_stack
      AGENT_STACK_DB_USER: agentstack
      AGENT_STACK_DB_PASSWORD: agentstack
      AGENT_STACK_RUNTIME_URL: http://runtime:8090
      AGENT_STACK_CORS_ORIGINS: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
      runtime:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  mysql-data:
