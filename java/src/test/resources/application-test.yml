server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${AGENT_STACK_DB_PORT:3307}/${AGENT_STACK_DB_TEST_NAME:agent_stack_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${AGENT_STACK_DB_USER:agentstack}
    password: ${AGENT_STACK_DB_PASSWORD:agentstack}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration

logging:
  level:
    local.agentstack: INFO
