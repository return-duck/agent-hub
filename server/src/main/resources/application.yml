server:
  port: ${AGENT_STACK_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: agent-stack-server
  datasource:
    url: jdbc:mysql://${AGENT_STACK_DB_HOST:127.0.0.1}:${AGENT_STACK_DB_PORT:3307}/${AGENT_STACK_DB_NAME:agent_stack}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${AGENT_STACK_DB_USER:agentstack}
    password: ${AGENT_STACK_DB_PASSWORD:agentstack}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway 是 schema 的唯一所有者。刻意不用 validate：Hibernate 6 在
      # LONGTEXT↔String 映射上会误报类型不匹配，而真正的漂移由集成测试的
      # 「存取往返断言」保护（见 AgentPersistenceIT）。
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  mvc:
    async:
      # SSE 长连接：必须大于最长运行时间
      request-timeout: 300000
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    local.agentstack: INFO
    org.flywaydb: INFO

app:
  runtime:
    base-url: ${AGENT_STACK_RUNTIME_URL:http://127.0.0.1:8090}
    # 单次 run 的整体上限；超过则判定 TIMEOUT 并写入终态事件
    execute-timeout-ms: ${AGENT_STACK_RUN_TIMEOUT_MS:180000}
  cors:
    allowed-origins: ${AGENT_STACK_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
